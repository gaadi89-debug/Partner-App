<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wingit Partner">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2318181a'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='700' font-size='30' fill='white' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#ffffff">
<title>Wingit Partner Onboarding</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Same tokens and components as the Wingit Partner app, so the two flows read as one product. */
:root{
  --bg:#e8e7e3;--app:#f6f5f2;--surface:#ffffff;--ink:#18181a;--ink2:#3c3c40;--muted:#77767c;--faint:#a3a2a8;
  --line:#e6e5e0;--line2:#efeee9;--chip:#efeee9;
  --ok:#2c7a4b;--okbg:#e6f2ea;--warn:#93590a;--warnbg:#fbf0dc;--bad:#b42318;--badbg:#fcebe9;
  --r:16px;--shadow:0 1px 2px rgba(20,20,20,.04),0 2px 8px rgba(20,20,20,.04);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px 12px;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg.i{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:16px;height:16px}
svg.i.l{width:24px;height:24px}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}

/* Device frame (desktop) / full screen (phone) */
.stage{position:relative;flex:0 0 auto}
.phone{width:410px;height:864px;transform-origin:top left;left:0;top:0;background:var(--app);border:10px solid #18181a;border-radius:48px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 30px 70px rgba(0,0,0,.2)}
.outside{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px;flex-wrap:wrap;justify-content:center}
.outside button,.outside select{border:1px solid #cbcac4;border-radius:999px;padding:6px 12px;background:#fff;font-size:12px;font-weight:500}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (max-width:520px), (hover:none) and (pointer:coarse){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{padding:0;justify-content:flex-start;align-items:stretch;gap:0;background:var(--surface)}
  .stage{width:100%!important;height:100%!important;max-width:560px;margin:0 auto}
  .phone{position:static;width:100%;height:100%;border:0;border-radius:0;box-shadow:none;transform:none!important}
  .outside,.statusbar{display:none!important}
  .foot{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .content{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  input,select,textarea{font-size:16px!important}
  .sheet{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
}
#app{display:flex;flex-direction:column;height:100%;position:relative}
.statusbar{height:36px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:4px 26px 0;font-size:13px;font-weight:600;background:var(--surface)}
.statusbar .sig{display:flex;gap:5px;align-items:center}
.statusbar .bat{width:22px;height:11px;border:1.5px solid var(--ink);border-radius:3px;position:relative}
.statusbar .bat::after{content:"";position:absolute;inset:1.5px;right:5px;background:var(--ink);border-radius:1px}

/* Top bars */
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .tt{flex:1;min-width:0}
.topbar .title{font-weight:600;font-size:17px;letter-spacing:-.01em}
.topbar .sub{font-size:12px;color:var(--muted)}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--app);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.stepno{font-size:11px;font-weight:600;color:var(--muted);background:var(--chip);border-radius:999px;padding:4px 9px;white-space:nowrap}
.brandbar{flex:0 0 auto;background:var(--surface);padding:10px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:0 0 auto}
.brandbar b{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.1;display:block}
.brandbar span{font-size:12px;color:var(--muted)}
.progress{height:3px;background:var(--line);flex:0 0 auto}
.progress i{display:block;height:100%;background:var(--ink);transition:width .35s ease}

/* Layout */
.content{flex:1;overflow-y:auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.content>*{flex-shrink:0}
.foot{flex:0 0 auto;padding:12px 16px 18px;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.foot .xs{text-align:center}
.h1{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.25;text-wrap:balance}
.lede{font-size:13px;color:var(--muted);margin-top:-6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.ct{font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.sb{justify-content:space-between}
.grow{flex:1;min-width:0}
.b{font-weight:600}
.small{font-size:12.5px}
.xs{font-size:11.5px}
.muted{color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line2)}
.kv:first-child{padding-top:0}
.kv:last-child{border-bottom:0;padding-bottom:0}
.kv>span{color:var(--muted);flex:0 0 auto}
.kv>b{text-align:right;font-weight:500;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:500;background:var(--chip);border-radius:6px;padding:2px 7px;color:var(--ink2);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.warn{background:var(--warnbg);color:var(--warn)}

/* Buttons */
.btn{background:var(--ink);color:#fff;border-radius:14px;padding:14px;font-weight:600;font-size:14.5px;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:opacity .15s}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid #d6d5cf}
.btn.sm{padding:10px 12px;font-size:13.5px;border-radius:12px}
.btn.full{width:100%}
.btn[disabled]{opacity:.32;pointer-events:none}
.link{color:var(--ink);font-size:12.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.link[disabled]{color:var(--faint);text-decoration:none;font-weight:500;pointer-events:none}

.banner{border-radius:12px;padding:11px 13px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.banner.ok{background:var(--okbg);color:var(--ok)}
.banner.muted{background:#e9e8e3;color:#4e4d53}

/* Fields */
.otp{width:100%;font-size:30px;letter-spacing:.7em;text-indent:.7em;text-align:center;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-variant-numeric:tabular-nums;outline:none}
.otp:focus,.field:focus{border-color:var(--ink)}
.field{width:100%;border:1px solid #d9d8d2;border-radius:12px;padding:11px 12px;background:#fff;outline:none}
.field[readonly]{background:var(--chip);color:var(--ink2);border-color:var(--line)}
label.fl{font-size:12px;color:var(--muted);display:block;margin:10px 0 5px;font-weight:500}
.card label.fl:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2>*{min-width:0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mobile{display:flex;align-items:center;border:1px solid #d9d8d2;border-radius:12px;background:#fff;overflow:hidden}
.mobile:focus-within{border-color:var(--ink)}
.mobile span{padding:0 10px 0 12px;font-weight:600;border-right:1px solid var(--line);align-self:stretch;display:flex;align-items:center}
.mobile input{border:0;outline:none;flex:1;min-width:0;padding:13px 12px;font-size:17px;letter-spacing:.04em;font-variant-numeric:tabular-nums;background:transparent}

/* Choice cards */
.choice{display:flex;gap:14px;text-align:left;padding:16px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--line);width:100%;box-shadow:var(--shadow);align-items:center}
.choice.on{border-color:var(--ink)}
.choice .big{font-size:15px;font-weight:600}
.choice .ico{width:42px;height:42px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.radio{margin-left:auto;width:20px;height:20px;border-radius:50%;border:1.5px solid #c3c2bc;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.choice.on .radio{border-color:var(--ink);background:var(--ink)}
.choice.on .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}

/* Uploads */
.ups{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ups.one{grid-template-columns:1fr}
.up{position:relative;aspect-ratio:1.58;max-width:100%;border:1.5px dashed #d3d2cc;border-radius:12px;background:var(--app);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;overflow:hidden;font-size:11.5px;color:var(--muted)}
.ups.one .up{aspect-ratio:2.6}
.up b{color:var(--ink);font-size:12.5px}
.up.has{border-style:solid;border-color:var(--line)}
.up.has img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.up .re{position:absolute;bottom:6px;right:6px;background:rgba(24,24,26,.78);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px}
.up:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.or::before,.or::after{content:"";flex:1;height:1px;background:#dcdbd5}

/* Selfie */
.selfie{width:200px;height:200px;max-width:100%;border-radius:50%;margin:6px auto 0;border:2px dashed #d3d2cc;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--surface);cursor:pointer;color:var(--faint)}
.selfie.has{border:3px solid var(--ink)}
.selfie img{width:100%;height:100%;object-fit:cover}
.selfie svg.i{width:56px;height:56px;stroke-width:1.3}
.tip{border:1px solid var(--line);border-radius:14px;padding:12px 8px;font-weight:500;font-size:12px;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--ink2)}

/* Review */
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:56px;height:36px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.checkline{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:13px;color:var(--ink2)}
.chk{width:26px;height:26px;border-radius:8px;border:1.5px solid #c3c2bc;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#fff;color:#fff}
.chk.on{background:var(--ink);border-color:var(--ink)}

/* Done */
.center{text-align:center}
.bigicon{width:56px;height:56px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;background:var(--chip)}
.bigicon.ok{background:var(--okbg);color:var(--ok)}
.bigicon svg{width:28px;height:28px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .st{position:relative;padding:4px 0 12px}
.tl .st:last-child{padding-bottom:0}
.tl .st::before{content:"";position:absolute;left:-21px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--surface)}
.tl .st.now::before{background:#d88a0b}
.tl .st.pending::before{background:#d3d2cc}

/* Sheet & toast */
.overlay{position:absolute;inset:0;background:rgba(10,10,12,.42);display:flex;align-items:flex-end;z-index:20;animation:fade .15s}
.sheet{background:var(--surface);width:100%;border-radius:24px 24px 0 0;padding:10px 18px 24px;display:flex;flex-direction:column;gap:12px;animation:up .2s ease}
.grab{width:40px;height:4px;border-radius:2px;background:#d9d8d2;margin:0 auto 4px}
.sheet h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.sheet ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.sheet li{display:flex;gap:10px;align-items:center;font-size:13.5px}
.sheet li svg{color:var(--ok)}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--ink);animation:spin .9s linear infinite;margin:14px auto 4px}
.toast{position:absolute;left:16px;right:16px;top:92px;background:var(--ink);color:#fff;padding:13px 14px;border-radius:14px;font-size:13px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;animation:up .2s ease;pointer-events:none}
@media (max-width:520px), (hover:none) and (pointer:coarse){.toast{top:calc(64px + env(safe-area-inset-top,0px))}}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="stage" id="stage"><div class="phone" id="phone"><div id="app"></div></div></div>
<div class="outside"><span>Demo · any 4-digit OTP works</span>
  <select id="jump" aria-label="Jump to screen"></select>
  <button id="fillBtn" type="button">Fill sample</button>
  <button id="resetBtn" type="button">Reset demo</button></div>

<script>
(function(){
/* ---------- Icons (same set and stroke as the partner app) ---------- */
const IC = {
  back:'<path d="M15 5l-7 7 7 7"/>', arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  nav:'<path d="M3 11 21 3l-8 18-2-8z"/>',
  camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  doc:'<path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/>',
  scooter:'<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M9 17h6l-2-7h-3M16 6h2l2 8"/>',
  car:'<path d="M4 16v-4l2-5h12l2 5v4z"/><circle cx="7.5" cy="16.5" r="1.8"/><circle cx="16.5" cy="16.5" r="1.8"/><path d="M4 12h16"/>',
  bus:'<rect x="5" y="3.5" width="14" height="14" rx="2.5"/><path d="M5 11h14M8 20.5v-3M16 20.5v-3"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  glasses:'<circle cx="7" cy="14" r="3.5"/><circle cx="17" cy="14" r="3.5"/><path d="M10.5 14h3M3 4l18 16"/>',
  focus:'<path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3"/><circle cx="12" cy="12" r="3"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/>'
};
const ic=(n,cls='')=>`<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

const STEPS=['about','address','docs','travel','selfie','review'];
const TITLES={about:['About you','As on your Aadhaar'],address:['Address','Where you live now'],docs:['Documents','Aadhaar and PAN for KYC'],travel:['Travel','How you reach visits'],selfie:['Selfie','To match your ID'],review:['Review','Check before you submit']};
const ALL=[['login','Mobile number'],['otp','OTP'],['about','About you'],['address','Address'],['docs','Documents'],['travel','Travel'],['selfie','Selfie'],['review','Review'],['done','Submitted']];
const PINS={'122':['Gurugram','Haryana'],'121':['Faridabad','Haryana'],'110':['New Delhi','Delhi'],'201':['Noida','Uttar Pradesh']};

const blank=()=>({phone:'',otp:'',name:'',dob:'',father:'',mother:'',house:'',street:'',landmark:'',pin:'',city:'',state:'',pinKnown:true,
  aadhaarNo:'',panNo:'',docs:{aF:null,aB:null,pan:null,dlF:null,dlB:null},digi:false,travel:'',dlNo:'',selfie:null,consent:false});
let S=blank(), screen='login', fromReview=false, timer=null;
const $=(q,r=document)=>r.querySelector(q), $$=(q,r=document)=>[...r.querySelectorAll(q)];
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function ageOf(d){ if(!d) return null; const b=new Date(d+'T00:00:00'); if(isNaN(b)) return null; const t=new Date();
  let a=t.getFullYear()-b.getFullYear(); const m=t.getMonth()-b.getMonth(); if(m<0||(m===0&&t.getDate()<b.getDate())) a--; return a; }
const ageText=d=>{ const a=ageOf(d); return a!==null&&a>=0 ? a+' years' : ''; };
const own=()=>S.travel==='bike'||S.travel==='car';
const maskA=n=>n.length===12?'XXXX XXXX '+n.slice(8):'—';
const fmtDob=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'—';
const fmtPh=p=>{ p=p||'9876543210'; return '+91 '+p.slice(0,5)+' '+p.slice(5); };
const today=()=>new Date().toISOString().slice(0,10);

function sample(label){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 316 200"><rect width="316" height="200" rx="14" fill="#ebeae5"/><rect x="18" y="18" width="280" height="22" rx="4" fill="#d6d5cf"/><rect x="18" y="58" width="70" height="88" rx="6" fill="#dcdbd5"/><rect x="104" y="62" width="150" height="10" rx="5" fill="#c3c2bc"/><rect x="104" y="84" width="110" height="10" rx="5" fill="#d6d5cf"/><rect x="104" y="106" width="130" height="10" rx="5" fill="#d6d5cf"/><text x="18" y="182" font-family="Arial" font-size="13" fill="#77767c">${label}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
const SAMPLE_FACE='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#e6e1da"/><circle cx="100" cy="82" r="38" fill="#b59a86"/><path d="M30 200c10-45 38-62 70-62s60 17 70 62z" fill="#3c3c40"/></svg>');

/* ---------- Validity ---------- */
function valid(){
  switch(screen){
    case 'login': return /^[6-9]\d{9}$/.test(S.phone);
    case 'otp': return /^\d{4}$/.test(S.otp);
    case 'about': return S.name.trim().length>=3 && ageOf(S.dob)!==null && S.father.trim().length>=2 && S.mother.trim().length>=2;
    case 'address': return !!(S.house.trim() && S.street.trim() && /^\d{6}$/.test(S.pin) && S.city.trim() && S.state.trim());
    case 'docs': return S.digi || !!(S.docs.aF && S.docs.aB && S.docs.pan && /^\d{12}$/.test(S.aadhaarNo) && /^[A-Z]{5}\d{4}[A-Z]$/.test(S.panNo));
    case 'travel': return !!S.travel && (!own() || S.digi || !!(S.docs.dlF && S.docs.dlB && S.dlNo.replace(/\s/g,'').length>=10));
    case 'selfie': return !!S.selfie;
    case 'review': return S.consent;
    default: return true;
  }
}
/* Demo mode: every button works without filling or uploading anything. Set to false to turn the checks back on. */
const DEMO=true;
function update(){ const c=$('#cta'); if(c) c.disabled=DEMO?false:!valid(); }

/* ---------- Shared pieces ---------- */
const statusbar=()=>`<div class="statusbar"><span id="clock">${new Date().toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:false})}</span><span class="sig">${ic('nav','s')}<span class="bat"></span></span></div>`;
function top(){
  if(screen==='login'||screen==='otp'||screen==='done')
    return `<header class="brandbar">${screen==='otp'?`<button class="iconbtn" data-go="login" aria-label="Back">${ic('back')}</button>`:''}<div class="logo">W</div><div><b>Wingit Partner</b><span>${screen==='done'?'Application':'Sign up'}</span></div></header>`;
  const i=STEPS.indexOf(screen), prev=i===0?null:STEPS[i-1];
  return `<header class="topbar">${prev?`<button class="iconbtn" data-go="${prev}" aria-label="Back">${ic('back')}</button>`:''}
    <div class="tt"><div class="title">${TITLES[screen][0]}</div><div class="sub">${TITLES[screen][1]}</div></div>
    <span class="stepno">Step ${i+1} of ${STEPS.length}</span></header>
    <div class="progress"><i style="width:${((i+1)/STEPS.length)*100}%"></i></div>`;
}
function foot(label,note){
  const lbl=fromReview&&STEPS.includes(screen)&&screen!=='review'?'Save and go to review':label;
  return `<footer class="foot"><button class="btn full" id="cta" type="button">${lbl} ${ic('arrow','s')}</button>${note?`<div class="xs muted">${note}</div>`:''}</footer>`;
}
const fld=(id,k,label,val,attrs='')=>`<label class="fl" for="${id}">${label}</label><input class="field" id="${id}" data-k="${k}" value="${esc(val)}" ${attrs}>`;
function tile(key,label){
  const v=S.docs[key];
  return `<label class="up ${v?'has':''}" for="f-${key}"><input class="sr" type="file" id="f-${key}" data-up="${key}" accept="image/*">
    ${v?`<img src="${v}" alt="${label}"><span class="re">Retake</span>`:`${ic('camera')}<b>${label}</b><span>Tap to add photo</span>`}</label>`;
}

const V={

  <div class="card">
    <div class="kv"><span>Aadhaar</span><b>${maskA(S.aadhaarNo)} <span class="tag ok">${ic('check','s')}Verified</span></b></div>
    <div class="kv"><span>PAN</span><b>${esc(S.panNo)} <span class="tag ok">${ic('check','s')}Verified</span></b></div>
    <div class="kv"><span>Name on ID</span><b>${esc(S.name||'Priya Sharma')}</b></div></div>

    <div class="ups one">${tile('pan','Front')}</div>
    ${fld('pn','panNo','PAN number',S.panNo,'maxlength="10" autocapitalize="characters" autocomplete="off" placeholder="ABCDE1234F" style="text-transform:uppercase"')}</div>
  <div class="banner muted">${ic('camera','s')}<span>Lay the card flat in good light, with all four corners visible.</span></div>
  </main>${foot('Continue')}`,

travel:()=>{
  const opt=(v,i,t,s)=>`<button type="button" class="choice ${S.travel===v?'on':''}" role="radio" aria-checked="${S.travel===v}" data-tr="${v}"><span class="ico">${ic(i)}</span><span><span class="big">${t}</span><br><span class="xs muted">${s}</span></span><span class="radio"></span></button>`;

    : `<div class="card"><div class="ct">${ic('doc','s')}Driving licence ${S.docs.dlF&&S.docs.dlB?`<span class="tag ok" style="margin-left:auto">${ic('check','s')}Added</span>`:''}</div>
      <div class="ups">${tile('dlF','Front')}${tile('dlB','Back')}</div>
      ${fld('dln','dlNo','Licence number',S.dlNo,'autocapitalize="characters" autocomplete="off" placeholder="e.g. HR26 20190012345" style="text-transform:uppercase"')}</div>`;
  return `<main class="content">
  <div role="radiogroup" aria-label="Travel mode" style="display:flex;flex-direction:column;gap:8px">
    ${opt('bike','scooter','Own two-wheeler','Scooter or bike')}
    ${opt('car','car','Own car','You drive yourself')}
    ${opt('cab','bus','Cab or public transport','Auto, cab or metro')}</div>
  ${dl}</main>${foot('Continue')}`; },

selfie:()=>`<main class="content">
  <label class="selfie ${S.selfie?'has':''}" for="f-selfie"><input class="sr" type="file" id="f-selfie" accept="image/*" capture="user">
    ${S.selfie?`<img src="${S.selfie}" alt="Your selfie">`:ic('user')}</label>
  <label for="f-selfie" class="btn ghost" style="align-self:center;cursor:pointer">${ic('camera','s')}${S.selfie?'Retake selfie':'Open camera'}</label>
  <div class="grid3"><div class="tip">${ic('sun')}Good light</div><div class="tip">${ic('glasses')}No glasses or mask</div><div class="tip">${ic('focus')}Face in the circle</div></div>
  <div class="xs muted center">This photo also goes on your partner ID.</div>
  </main>${foot('Continue')}`,

review:()=>{
  const sec=(t,go,rows,extra='')=>`<div class="card"><div class="ct">${t}<button class="link" data-edit="${go}" style="margin-left:auto">Edit</button></div>
    ${rows.map(([k,v])=>`<div class="kv"><span>${k}</span><b>${esc(v)||'—'}</b></div>`).join('')}${extra}</div>`;
  const th=keys=>{const im=keys.map(k=>S.docs[k]).filter(Boolean); return im.length?`<div class="thumbs">${im.map(s=>`<img src="${s}" alt="">`).join('')}</div>`:''};
  const tl={bike:'Own two-wheeler',car:'Own car',cab:'Cab or public transport'}[S.travel]||'';
  const a=ageOf(S.dob);
  return `<main class="content">
  ${sec('About you','about',[['Mobile',fmtPh(S.phone)],['Name',S.name],['Date of birth',fmtDob(S.dob)],['Age',a!==null?a+' years':''],['Father',S.father],['Mother',S.mother]])}
  ${sec('Address','address',[['Address',[S.house,S.street,S.landmark].filter(Boolean).join(', ')],['City',S.city],['State',S.state],['Pincode',S.pin]])}
  ${sec('Documents','docs',[['Aadhaar',maskA(S.aadhaarNo)],['PAN',S.panNo],['Source',S.digi?'DigiLocker':'Photo upload']],S.digi?'':th(['aF','aB','pan']))}
  ${sec('Travel','travel',[['Mode',tl]].concat(own()?[['Licence',S.dlNo]]:[]),!S.digi&&own()?th(['dlF','dlB']):'')}
  <div class="card"><div class="ct">Selfie<button class="link" data-edit="selfie" style="margin-left:auto">Edit</button></div>

  </main>${foot('Submit application')}`; },

done:()=>{ const first=(S.name||'').trim().split(/\s+/)[0];
  return `<main class="content">
  <div class="center" style="display:flex;flex-direction:column;gap:8px;padding-top:18px">
    <div class="bigicon ok">${ic('check')}</div>
    <div class="h1">Application sent${first?', '+esc(first):''}</div>
    <p class="small muted">We'll review your details and call you on ${fmtPh(S.phone)}.</p>
    <span class="tag" style="align-self:center">Application WP-${String(Date.now()).slice(-6)}</span></div>
  <div class="card"><div class="ct">What happens next</div><div class="tl">
    <div class="st"><div class="b small">Application submitted</div><div class="xs muted">Today, ${new Date().toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'})}</div></div>
    <div class="st now"><div class="b small">Document check</div><div class="xs muted">In progress. We'll message you if anything needs fixing.</div></div>
    <div class="st pending"><div class="b small">Call from the Wingit team</div><div class="xs muted">We'll explain the next steps.</div></div></div></div>
  <div class="banner muted">${ic('bell','s')}<span>Keep notifications on so you don't miss an update.</span></div>
  </main>${foot('Done')}`; }
};

/* ---------- Render + bind ---------- */
function go(to){ screen=to; render(); }
function render(){
  clearInterval(timer);
  app.innerHTML=statusbar()+top()+V[screen]();
  bind(); update(); paintJump();
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.innerHTML=ic('check','s')+esc(msg); app.appendChild(t); setTimeout(()=>t.remove(),2400); }

function bind(){
  $$('[data-go]',app).forEach(b=>b.onclick=()=>{ if(b.dataset.go==='login') S.otp=''; go(b.dataset.go); });
  $$('[data-edit]',app).forEach(b=>b.onclick=()=>{ fromReview=true; go(b.dataset.edit); });
  $$('input[data-k]',app).forEach(inp=>inp.addEventListener('input',()=>{
    const k=inp.dataset.k; let v=inp.value;
    if(k==='phone'||k==='pin'||k==='aadhaarNo'){ v=v.replace(/\D/g,''); inp.value=v; }
    if(k==='panNo') v=v.toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(k==='dlNo') v=v.toUpperCase();
    S[k]=v;
    if(k==='dob') $('#age').value=ageText(v);
    if(k==='pin') onPin();
    update();
  }));
  $$('input[data-up]',app).forEach(inp=>inp.onchange=()=>readFile(inp,src=>{ S.docs[inp.dataset.up]=src; render(); }));
  const sf=$('#f-selfie',app); if(sf) sf.onchange=()=>readFile(sf,src=>{ S.selfie=src; render(); });
  $$('[data-tr]',app).forEach(b=>b.onclick=()=>{ S.travel=b.dataset.tr; render(); });
  const cons=$('#cons',app); if(cons) cons.onclick=()=>{ S.consent=!S.consent; cons.setAttribute('aria-checked',S.consent); $('.chk',cons).classList.toggle('on',S.consent); update(); };
  const dg=$('#digi',app); if(dg) dg.onclick=digiSheet;
  const ud=$('#undoDigi',app); if(ud) ud.onclick=()=>{ S.digi=false; S.aadhaarNo=''; S.panNo=''; S.dlNo=''; render(); };
  if(screen==='otp') bindOtp();
  if(screen==='login') $('#ph').addEventListener('keydown',e=>{ if(e.key==='Enter'&&(DEMO||valid())) next(); });
  $('#cta').onclick=()=>{ if(DEMO||valid()) next(); };
}
function onPin(){
  const keep=()=>{ const p=$('#pin'); p.focus(); p.setSelectionRange(S.pin.length,S.pin.length); };
  if(S.pin.length===6){ const hit=PINS[S.pin.slice(0,3)];
    if(hit){ S.city=hit[0]; S.state=hit[1]; S.pinKnown=true; } else { S.pinKnown=false; S.city=''; S.state=''; }
    render(); keep();
  } else if(!S.pinKnown||S.city){ S.city=''; S.state=''; S.pinKnown=true; render(); keep(); }
}
function readFile(inp,cb){ const f=inp.files&&inp.files[0]; if(!f) return;
  if(f.size>8*1024*1024){ toast('That photo is over 8 MB. Try a smaller one.'); return; }
  const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(f); }
function bindOtp(){
  const o=$('#otp'); o.focus();
  o.addEventListener('input',()=>{ o.value=o.value.replace(/\D/g,'').slice(0,4); S.otp=o.value; update();
    if(S.otp.length===4) setTimeout(()=>{ if(screen==='otp'&&valid()) next(); },250); });
  let s=30; timer=setInterval(()=>{ s--; const el=$('#sec'); if(el) el.textContent=s;
    if(s<=0){ clearInterval(timer); $('#resend').innerHTML='Didn’t get it? <button class="link" id="rs">Resend OTP</button>';
      $('#rs').onclick=()=>{ S.otp=''; render(); toast('New OTP sent to '+fmtPh(S.phone)); }; } },1000);
}
function next(){
  const order=['login','otp','about','address','docs','travel','selfie','review','done'];
  if(screen==='done'){ toast('In the full app, this opens partner home.'); return; }
  if(fromReview&&STEPS.includes(screen)&&screen!=='review'){ fromReview=false; return go('review'); }
  if(screen==='review') fromReview=false;
  go(order[order.indexOf(screen)+1]);
}
function digiSheet(){
  const w=document.createElement('div'); w.className='overlay';
  w.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dgt"><div class="grab"></div>
    <h2 id="dgt">Share documents from DigiLocker</h2>
    <p class="small muted">Wingit will get a verified copy of:</p>
    <ul><li>${ic('check','s')}Aadhaar (last 4 digits only)</li><li>${ic('check','s')}PAN card</li><li>${ic('check','s')}Driving licence, if you have one</li></ul>
    <button class="btn full" id="dgOk" type="button">Allow and continue</button><button class="btn ghost full" id="dgNo" type="button">Not now</button></div>`;
  w.addEventListener('click',e=>{ if(e.target===w) w.remove(); });
  app.appendChild(w);
  $('#dgNo',w).onclick=()=>w.remove();
  $('#dgOk',w).onclick=()=>{
    $('.sheet',w).innerHTML=`<div class="grab"></div><div class="spin" role="status" aria-label="Fetching"></div><p class="small muted center">Fetching your documents…</p>`;
    setTimeout(()=>{ w.remove(); S.digi=true; S.aadhaarNo=S.aadhaarNo.length===12?S.aadhaarNo:'582047734821'; S.panNo=S.panNo||'BQKPS4821K'; S.dlNo=S.dlNo||'HR26 20190012345'; render(); toast('Documents fetched from DigiLocker'); },1300);
  };
}

/* ---------- Demo controls ---------- */
function paintJump(){ const j=$('#jump'); j.innerHTML=ALL.map(([k,l])=>`<option value="${k}" ${k===screen?'selected':''}>${l}</option>`).join(''); }
$('#jump').onchange=e=>{ fromReview=false; go(e.target.value); };
$('#fillBtn').onclick=()=>{
  Object.assign(S,{phone:'9876543210',otp:'4821',name:'Priya Sharma',dob:'1996-08-14',father:'Rajesh Sharma',mother:'Sunita Sharma',
    house:'B-204, Palm Residency',street:'Sector 56, Golf Course Extension Road',landmark:'Near Sector 56 Metro',pin:'122011',city:'Gurugram',state:'Haryana',pinKnown:true,
    aadhaarNo:'582047734821',panNo:'BQKPS4821K',travel:'bike',dlNo:'HR26 20190012345',digi:false,consent:false});
  S.docs={aF:sample('Aadhaar · front'),aB:sample('Aadhaar · back'),pan:sample('PAN'),dlF:sample('Licence · front'),dlB:sample('Licence · back')};
  S.selfie=SAMPLE_FACE; render(); toast('Sample data filled in');
};
$('#resetBtn').onclick=()=>{ S=blank(); fromReview=false; go('login'); };

/* Same phone scaling as the partner app */
function fit(){
  const st=$('#stage'), ph=$('#phone');
  if(matchMedia('(max-width:520px), (hover:none) and (pointer:coarse)').matches){ st.style.width=st.style.height=''; ph.style.transform=''; return; }
  const sc=Math.min(1,(innerHeight-70)/864,(innerWidth-24)/410);
  ph.style.transform=`scale(${sc})`; st.style.width=410*sc+'px'; st.style.height=864*sc+'px';
}
addEventListener('resize',fit); fit();
setInterval(()=>{ const c=$('#clock'); if(c) c.textContent=new Date().toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:false}); },15000);
render();
})();
</script>
